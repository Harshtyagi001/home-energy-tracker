spring.application.name=ingestion-service
server.port = 8082

# Kafka bootstrap (override with env var KAFKA_BOOTSTRAP_SERVERS). For production set KAFKA_BOOTSTRAP_SERVERS to your cluster's bootstrap DNS names.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Production-grade producer tuning (idempotence, acknowledgements, timeouts)
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.retries=5
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.linger-ms=20
spring.kafka.producer.delivery-timeout-ms=120000
spring.kafka.producer.request-timeout-ms=30000
spring.kafka.client-id=ingestion-service-producer

# Retry interval for the application's local retry queue (ms)
kafka.retry-interval-ms=10000
